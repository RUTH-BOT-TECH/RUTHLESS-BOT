name: Pairing site uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check pairing service health
        env:
          HEALTH_URL: https://venom-bot-rqpa.onrender.com/health
        run: curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 "$HEALTH_URL"
