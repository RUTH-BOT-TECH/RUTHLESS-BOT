<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruthless · Connect WhatsApp</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c0e16;color:#f5f5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0%,#292247 0,transparent 40%),#0c0e16}.card{width:min(100%,480px);background:#151722;border:1px solid #303044;border-radius:24px;padding:32px;box-shadow:0 18px 80px #0007}small{color:#b99cff;letter-spacing:.14em;font-weight:700}h1{font-size:2rem;line-height:1.12;margin:.6em 0}p{line-height:1.6;color:#b8bbcb}.tabs{display:flex;gap:8px;margin:24px 0}button{border:0;border-radius:11px;padding:13px 16px;color:#fff;background:#343346;cursor:pointer;font-weight:700}button.active,button.primary{background:#8561f1}.primary{width:100%;margin:16px 0}label{display:block;color:#ddd;font-size:.9rem}input{width:100%;margin-top:8px;padding:14px;border-radius:10px;border:1px solid #48485c;background:#0f1019;color:#fff;font-size:1rem}#result{margin-top:20px;border:1px solid #3b3853;border-radius:14px;padding:16px;display:none}#code{font-size:2rem;letter-spacing:.18em;color:#d4c4ff;font-weight:bold}img{max-width:100%;background:white;border-radius:8px}#message{white-space:pre-line}footer{margin-top:24px;color:#85879b;font-size:.83rem}
</style></head><body><main class="card"><small>RUTHLESS MD</small><h1>Connect your WhatsApp.</h1><p>Choose how you want to link your account. Your session ID will be sent privately to your WhatsApp, never shown here.</p><div class="tabs"><button id="codeTab" class="active" type="button">Pairing code</button><button id="qrTab" type="button">Scan QR</button></div><form id="form"><div id="numberField"><label for="phone">WhatsApp number</label><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="e.g. 2348012345678"><p>International number without + or spaces.</p></div><button class="primary" id="start">Get pairing code</button></form><section id="result" aria-live="polite"><div id="code"></div><img id="qr" alt="WhatsApp linking QR code" hidden><p id="message"></p></section><footer>Only link your own account. Treat your session ID like a password and never share it.</footer></main>
<script>
let mode='code',timer=null,activeHandle=null;const $=id=>document.getElementById(id);function select(m){mode=m;$('codeTab').classList.toggle('active',m==='code');$('qrTab').classList.toggle('active',m==='qr');$('numberField').hidden=m==='qr';$('start').textContent=m==='code'?'Get pairing code':'Get QR code'}$('codeTab').onclick=()=>select('code');$('qrTab').onclick=()=>select('qr');
$('form').onsubmit=async e=>{e.preventDefault();if(timer)clearTimeout(timer);activeHandle=null;$('result').style.display='block';$('code').textContent='';$('qr').hidden=true;$('message').textContent='Starting secure pairing…';$('start').disabled=true;try{const input={mode};if(mode==='code'){input.phone=$('phone').value.trim();if(!/^\d{6,15}$/.test(input.phone))throw Error('Enter 6–15 international digits.')}const r=await fetch('/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(input)});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not start pairing.');activeHandle=data.handle;poll(data.handle)}catch(err){$('message').textContent=err.message;$('start').disabled=false}};
async function poll(handle){if(handle!==activeHandle)return;try{const r=await fetch('/pair/status?handle='+encodeURIComponent(handle),{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Pairing expired.');if(data.status==='delivered'){$('code').textContent='';$('qr').hidden=true;$('message').textContent='Check your WhatsApp.';$('start').disabled=false;return}if(data.status==='failed'||data.status==='expired')throw Error('Pairing or private delivery failed. Please pair again.');if(data.code){$('code').textContent=data.code;$('message').textContent='WhatsApp → Linked devices → Link a device → Link with phone number.'}if(data.qr){$('qr').src=data.qr;$('qr').hidden=false;$('message').textContent='Scan from WhatsApp → Linked devices → Link a device.'}timer=setTimeout(()=>poll(handle),2000)}catch(e){$('code').textContent='';$('qr').hidden=true;$('message').textContent=e.message;$('start').disabled=false}}
</script></body></html>
