services:
  - type: web
    name: ruthless-bot
    runtime: node
    buildCommand: ONNXRUNTIME_NODE_INSTALL=skip npm ci && sh scripts/install-youtube.sh
    startCommand: node index.js
    healthCheckPath: /ready
    envVars:
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_ID
        sync: false
      - key: HEARTBEAT
        value: 'off'
